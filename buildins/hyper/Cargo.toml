[package]
name = "hyper"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata.trueos-blueprint]
replicatable = false
entry-abi = "argv-v1"
fs-scope = "trueosfs"

[[bin]]
name = "hyper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
reqwest = { version = "=0.13.3", default-features = false, features = ["rustls"] }
tokio = { version = "=1.52.3", default-features = false, features = ["full"] }

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
trueos = { path = "../../api", features = ["tokio-net-probe"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[package]
name = "os"
version = "0.1.0"
edition = "2024"

[package.metadata.trueos-blueprint]
filesystem-independent = true

[[bin]]
name = "os"
path = "src/main.rs"
test = false
bench = false

[dependencies]
crossterm = { path = "../../vendor/crossterm-0.29.0-trueos", default-features = false, features = ["events"] }
trueos = { path = "../../api" }

[patch.crates-io]
mio = { path = "../../vendor/mio-1.2.0" }
rustix = { path = "../../vendor/rustix-1.1.4-trueos" }
signal-hook-mio = { path = "../../vendor/signal-hook-mio-0.2.5-trueos" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[workspace]

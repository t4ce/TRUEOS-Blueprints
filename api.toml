manifest-version = 1

[api]
id = "trueos-blueprint-api"
version = "0.1.0"

[compat]
phases = ["target", "libc", "std", "tokio"]

[target]
spec = "apps/target.json"
os = "trueos"
env = "musl"
families = ["unix"]
relocation_model = "pic"
code_model = "small"

[build_std]
std = true
panic = "abort"
components = ["core", "compiler_builtins", "alloc", "std", "panic_abort"]

[overlays]
enabled = ["libc"]
optional = ["std", "tokio"]

[overlay_policy]
apply_order = ["libc", "std", "tokio"]
tokio_requires = ["std"]
tokio_role = "map proven async, time, poll, and runtime subsets onto TRUEOS platform services after the std contract is in place"

[policy]
app_root_cwd = true
reroute_std_fs = true
reroute_std_time = true
tokio_after_std = true

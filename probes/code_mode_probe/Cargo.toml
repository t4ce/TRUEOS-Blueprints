[package]
name = "code_mode_probe"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "code_mode_probe"
path = "main.rs"

[dependencies]
codex-code-mode-quickjs = { path = "../../../codex/codex-rs/code-mode-quickjs" }
codex-code-mode-protocol = { path = "../../../codex/codex-rs/code-mode-protocol" }
codex-protocol = { path = "../../../codex/codex-rs/protocol" }
serde_json = "=1.0.150"
tokio = { version = "=1.54.1", features = ["full"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }

[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../../api", features = ["tokio-runtime"] }

[workspace]

# Match the protocol workspace's patched contracts without importing every
# unrelated Blueprint probe into this standalone dependency resolution.
[patch.crates-io]
httpdate = { path = "../../vendor/httpdate-1.0.3" }
rama-dns = { path = "../../vendor/rama-dns-0.3.0-alpha.4-trueos" }
rustls-rustcrypto = { path = "../../vendor/rustls-rustcrypto-0.0.2-alpha" }
rama-tls-rustls = { path = "../../vendor/rama-tls-rustls-0.3.0-alpha.4-rustcrypto" }
sqlx-sqlite = { path = "../../vendor/sqlx-sqlite-0.9.0" }

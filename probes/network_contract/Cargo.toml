[package]
name = "network_contract"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "network_contract"
path = "main.rs"

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
rustls.workspace = true
rustls-rustcrypto.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "trueos")'.dependencies]
trueos.workspace = true

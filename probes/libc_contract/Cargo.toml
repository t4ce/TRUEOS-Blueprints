[package]
name = "libc_contract"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "libc_contract"
path = "main.rs"

[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../../api", features = ["tokio-runtime"] }

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos"))'] }

[package]
name = "ptts-check"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[features]
tokio-net-probe = []

[package.metadata.trueos-blueprint]
entry-abi = "argv-v1"
filesystem-independent = true
replicatable = false
rewrite-std-imports = false

[dependencies]
serde_json = "=1.0.150"

[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../../api" }

[profile.release]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos"))'] }

[package]
name = "reqwest_blocking"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "reqwest_blocking"
path = "main.rs"

[dependencies]
# Keep member features explicit when the Blueprint packer materializes this crate.
# The workspace/source overlay supplies the vendored implementation.
reqwest = { version = "=0.13.3", default-features = false, features = ["blocking", "rustls"] }
trueos.workspace = true

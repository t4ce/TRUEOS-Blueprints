[package]
name = "depthchecker_factchecker"
version = "0.1.0"
edition = "2024"

[workspace]

[package.metadata.trueos-blueprint]
stack-capture = true

[[bin]]
name = "depthchecker_factchecker"
path = "src/main.rs"

[dependencies]
codex-utils-text = { path = "../../../codex/codex-rs/utils/text" }
codex-utils-paths = { path = "../../../codex/codex-rs/utils/paths" }
codex-transport = { path = "../../../codex/codex-rs/transport" }
codex-protocol = { path = "../../../codex/codex-rs/protocol" }
http = "1.3.1"
serde_json = { version = "=1.0.150", features = ["raw_value"] }
zstd = "0.13"

[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../../api" }

# Reproduce the audited implementation pins required by Codex's own workspace.
# The Blueprint packer adds its remaining platform overlays to the staged build.
[patch.crates-io]
httpdate = { path = "../../vendor/httpdate-1.0.3" }
rustls-rustcrypto = { path = "../../vendor/rustls-rustcrypto-0.0.2-alpha" }
rama-dns = { path = "../../vendor/rama-dns-0.3.0-alpha.4-trueos" }
rama-tls-rustls = { path = "../../vendor/rama-tls-rustls-0.3.0-alpha.4-rustcrypto" }

[profile.release]
opt-level = 1
debug = 2
split-debuginfo = "off"
strip = false
lto = false
codegen-units = 8

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos"))'] }

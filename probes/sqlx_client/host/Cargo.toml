[package]
name = "sqlx-client-host"
version = "0.1.0"
edition = "2024"
build = "../build.rs"
[workspace]
[[bin]]
name = "sqlx_client"
path = "../src/main.rs"
[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "migrate", "runtime-tokio", "chrono", "json", "time", "uuid"] }
sqlx-sqlite = { path = "../../../vendor/sqlx-sqlite-0.9.0", features = ["trueos-remote", "offline"] }
tokio = { version = "1.52", features = ["rt", "macros", "time"] }
serde_json = "1.0"
[patch.crates-io]
sqlx-sqlite = { path = "../../../vendor/sqlx-sqlite-0.9.0" }
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos"))'] }

[build-dependencies]
sqlx-core = { version = "=0.9.0", default-features = false, features = ["migrate"] }

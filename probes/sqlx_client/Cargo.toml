[package]
name = "sqlx_client"
version = "0.1.0"
edition = "2024"
[workspace]

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "migrate", "runtime-tokio", "chrono", "json", "time", "uuid"] }
sqlx-sqlite = { path = "../../vendor/sqlx-sqlite-0.9.0", features = ["offline"] }
tokio = { version = "1.52", features = ["rt", "net", "sync", "time", "macros"] }
serde_json = "1.0"
trueos = { path = "../../api", features = ["lifecycle-net"] }

[patch.crates-io]
sqlx-sqlite = { path = "../../vendor/sqlx-sqlite-0.9.0" }

[build-dependencies]
sqlx-core = { version = "=0.9.0", default-features = false, features = ["migrate"] }

[package]
name = "ttstt-bench"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[features]
# Native std TCP needs no legacy Tokio/socket2 adapter. Keep the build
# planner's inferred network feature local to this standalone probe.
tokio-net-probe = []
[package.metadata.trueos-blueprint]
entry-abi = "argv-v1"
filesystem-independent = true
replicatable = false
rewrite-std-imports = false
[dependencies]
serde_json = "=1.0.150"
[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../../api" }
[profile.release]
panic = "abort"
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos"))'] }

[package]
name = "webcam-frame"
version = "0.1.0"
edition = "2024"
publish = false

# Keep this utility independent from the TRUEOS workspace.
[workspace]

[dependencies]
jpeg-decoder = { version = "0.3.2", default-features = false }
png = "0.18.1"
softbuffer = { version = "0.4.8", default-features = false, features = ["wayland", "wayland-dlopen"] }
v4l = "0.14.0"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }


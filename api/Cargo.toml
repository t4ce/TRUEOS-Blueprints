[package]
name = "trueos"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = []
default-global-allocator = []
default-panic-handler = []
tokio-runtime = ["dep:tokio"]
tokio-net-probe = ["tokio-runtime", "dep:mio", "dep:socket2", "tokio/net"]

[lib]
name = "trueos"
path = "src/lib.rs"

[dependencies]
v = { path = "../../../crates/trueos-v" }
tokio = { path = "../../../vendor/tokio-1.52.1", default-features = false, features = ["rt", "macros", "sync", "time", "io-util", "io-std", "fs"], optional = true }
mio = { path = "../../../vendor/mio-1.2.0", default-features = false, features = ["os-poll", "net"], optional = true }
socket2 = { path = "../../../vendor/socket2-0.6.3", default-features = false, optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

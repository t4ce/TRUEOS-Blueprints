[package]
name = "trueos-ide"
version = "0.1.0"
edition = "2024"

[features]
default = ["store"]
store = ["dep:redb", "dep:sha2"]

[dependencies]
redb = { version = "4.2.0", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.142", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"], optional = true }

[workspace]

[package]
name = "trueos-ide"
version = "0.1.0"
edition = "2024"

[features]
default = ["store"]
store = ["store-core", "std"]
store-core = ["dep:redb", "dep:sha2", "dep:trueos-redb"]
std = ["serde/std", "serde_json/std", "redb?/std", "sha2?/std", "trueos-redb?/std"]

[dependencies]
redb = { version = "4.4.0", default-features = false, features = ["experimental-api-5"], optional = true }
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.142", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10.9", default-features = false, optional = true }
trueos-redb = { path = "../trueos-redb", default-features = false, optional = true }

[workspace]

[package]
name = "pulsar_scenedb"
version = "0.1.0"
edition = "2021"
description = "SceneDB 2.0 — engine-wide spatial database (Layer 1 storage core)"
autoexamples = false
autobenches = false
autotests = false

[features]
default = []
gpu = ["dep:wgpu"]
telemetry = ["dep:socket2", "dep:serde", "gpu"]
trueos-vvideo = []
profiling = ["dep:profiling"]

[dependencies]
pulsar_reflection = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection", rev = "cf37ed000fedb9a01424c7e575d1d6ee30db7281" }
serde_json        = { workspace = true }
socket2           = { workspace = true, optional = true }
serde             = { workspace = true, optional = true }
ahash             = "0.8"
profiling         = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Profiling", rev = "12424a5f75166332f9f1d2741281f6fc4847b44d", optional = true }
tracing           = { workspace = true }
wgpu              = { version = "30", optional = true }

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
trueos = { path = "../../../../api" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

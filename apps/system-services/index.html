<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRUEOS System Services</title>
  <link rel="stylesheet" href="/tailwind.css">
</head>
<body data-app="system-services">
  <main class="services-shell">
    <header class="services-header">
      <div class="brand">
        <div class="brand-mark">OS</div>
        <div>
          <h1>System Services</h1>
          <p id="subtitle">Reading the kernel task registry…</p>
        </div>
      </div>
      <div id="summary" class="services-summary"></div>
      <button id="refresh" class="btn primary" type="button">Refresh</button>
    </header>

    <section class="services-container" aria-live="polite">
      <div id="error" class="services-error" hidden></div>
      <div id="grid" class="services-grid">
        <div class="service-card loading-card"><span class="status-dot"></span><h2>Loading</h2></div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));

    let loading = false;

    function requirementText(items) {
      return items?.length ? items.join(' · ') : 'None';
    }

    function render(snapshot) {
      const summary = snapshot.summary || {};
      $('subtitle').textContent = `${snapshot.serviceCount} registered · live at kernel t+${Math.round(snapshot.generatedAtMs / 1000)}s`;
      $('summary').innerHTML = `
        <span class="summary-chip started"><strong>${summary.started || 0}</strong> started</span>
        <span class="summary-chip waiting"><strong>${summary.waiting || 0}</strong> waiting</span>
        <span class="summary-chip disabled"><strong>${summary.disabled || 0}</strong> disabled</span>
        <span class="summary-chip pools"><strong>${summary.pools || 0}</strong> pools</span>`;
      $('grid').innerHTML = (snapshot.services || []).map((service) => `
        <article class="service-card status-${service.status.toLowerCase()} ${service.kind === 'pool' ? 'pool-card' : ''}">
          <div class="service-card-head">
            <div>
              <span class="service-kind">${service.kind === 'pool' ? 'Pool' : 'System'}</span>
              <h2>${esc(service.title)}</h2>
            </div>
            <span class="status-pill"><i></i>${esc(service.status)}</span>
          </div>
          <dl>
            <div><dt>Enabled</dt><dd>${service.enabled ? 'Yes' : 'No'}</dd></div>
            <div><dt>Requires</dt><dd>${esc(requirementText(service.requires))}</dd></div>
          </dl>
          <code title="Kernel registry name">${esc(service.name)}</code>
        </article>`).join('');
    }

    async function refresh() {
      if (loading) return;
      loading = true;
      $('refresh').disabled = true;
      try {
        const response = await fetch('/api/system-services/snapshot', { cache: 'no-store' });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        $('error').hidden = true;
        render(payload);
      } catch (error) {
        $('error').hidden = false;
        $('error').textContent = `Snapshot unavailable: ${error.message}`;
      } finally {
        loading = false;
        $('refresh').disabled = false;
      }
    }

    $('refresh').addEventListener('click', refresh);
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>

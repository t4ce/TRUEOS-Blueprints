# Native smoke-test manifest.
# In a scratch copy of this project, replace Cargo.toml with this file.

[package]
name = "tredb"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A tiny redb RAM explorer"
publish = false

[workspace]

[features]
default = []
trueos = []

[dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "bracketed-paste"] }
redb = { version = "=4.2.0", default-features = false, features = ["experimental-api-5"] }

[profile.dev]
codegen-units = 1
opt-level = 1
panic = "abort"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

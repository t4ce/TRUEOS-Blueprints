[package]
name = "prismq"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "prismq"
path = "main.rs"

[dependencies]
axum.workspace = true
prism-q = { path = "crates/prism-q", default-features = true }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
trueos.workspace = true
trueos-redb.workspace = true

[target.'cfg(not(any(target_os = "trueos", target_os = "zkvm")))'.dependencies]
trueos-redb = { path = "../../crates/trueos-redb", features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

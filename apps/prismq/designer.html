<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrismQ Circuit Designer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f2;
      --ink: #1d2323;
      --muted: #63706b;
      --panel: #ffffff;
      --line: #d9ddd4;
      --wire: #47534f;
      --gate: #173f3a;
      --gate-ink: #f8fffc;
      --control: #b93f35;
      --accent: #d8a642;
      --focus: #2d6cdf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    input,
    select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
    }

    button {
      cursor: pointer;
      padding: 0 12px;
      font-weight: 650;
    }

    button:hover {
      border-color: var(--wire);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 28%, transparent);
      outline-offset: 2px;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      border-right: 1px solid var(--line);
      background: #fbfbf7;
      padding: 18px;
      overflow: auto;
    }

    main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) minmax(190px, 30vh);
      min-width: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
      background: #fff;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 18px;
      line-height: 1.2;
    }

    h2 {
      margin-top: 24px;
      margin-bottom: 10px;
      font-size: 13px;
      text-transform: uppercase;
      color: var(--muted);
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 650;
    }

    input,
    select {
      width: 100%;
      padding: 0 10px;
    }

    textarea {
      width: 100%;
      height: 100%;
      min-height: 168px;
      resize: none;
      border: 0;
      border-top: 1px solid var(--line);
      padding: 14px 18px;
      background: #111817;
      color: #e8fff6;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      tab-size: 2;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .primary {
      background: var(--gate);
      border-color: var(--gate);
      color: var(--gate-ink);
    }

    .danger {
      color: #8b2119;
    }

    .controls,
    .gate-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .gate-fields {
      margin-top: 14px;
    }

    .gate-pad {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .gate-pad button {
      width: 100%;
      min-width: 0;
      padding: 0 4px;
    }

    .wide {
      grid-column: span 2;
    }

    .operations {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .operations li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px;
      gap: 8px;
      align-items: center;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      padding-left: 10px;
      font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .operations button {
      width: 34px;
      min-height: 32px;
      border: 0;
      border-left: 1px solid var(--line);
      border-radius: 0 6px 6px 0;
      background: transparent;
      color: #8b2119;
      padding: 0;
    }

    .stage {
      min-width: 0;
      overflow: auto;
      padding: 18px;
    }

    .circuit {
      display: grid;
      grid-auto-rows: 48px;
      align-items: stretch;
      width: max-content;
      min-width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 12px;
    }

    .wire-label {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 14px;
      color: var(--muted);
      font: 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 64px;
      height: 48px;
    }

    .cell::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 2px;
      background: var(--wire);
      opacity: .72;
      transform: translateY(-50%);
    }

    .join::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: var(--wire);
      transform: translateX(-50%);
    }

    .tile,
    .dot,
    .swap,
    .measure,
    .barrier {
      position: relative;
      z-index: 1;
    }

    .tile,
    .measure {
      display: grid;
      place-items: center;
      width: 38px;
      height: 34px;
      border-radius: 6px;
      background: var(--gate);
      color: var(--gate-ink);
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .measure {
      background: var(--accent);
      color: #211800;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--control);
      box-shadow: 0 0 0 3px #fff;
    }

    .swap {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      color: var(--control);
      font-size: 24px;
      line-height: 1;
      font-weight: 700;
    }

    .barrier {
      width: 6px;
      height: 38px;
      border-left: 2px dashed var(--control);
      border-right: 2px dashed var(--control);
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      main {
        min-height: 70vh;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>PrismQ Designer</h1>

      <h2>Registers</h2>
      <div class="controls">
        <label>Qubits
          <input id="qubits" type="number" min="1" max="26" step="1">
        </label>
        <label>Bits
          <input id="bits" type="number" min="0" max="26" step="1">
        </label>
      </div>

      <h2>Operands</h2>
      <div class="gate-fields">
        <label>Target
          <select id="target"></select>
        </label>
        <label>Control
          <select id="control"></select>
        </label>
        <label>Bit
          <select id="bit"></select>
        </label>
        <label>Angle
          <input id="angle" type="number" step="0.000001" value="1.570796">
        </label>
      </div>

      <h2>Gates</h2>
      <div class="gate-pad" id="gatePad"></div>

      <h2>Program</h2>
      <ul class="operations" id="operations"></ul>
    </aside>

    <main>
      <header>
        <div class="toolbar">
          <button id="bell" class="primary" type="button">Bell</button>
          <button id="ghz" type="button">GHZ</button>
          <button id="undo" type="button" aria-label="Undo last gate">Undo</button>
          <button id="clear" class="danger" type="button">Clear</button>
        </div>
        <div class="toolbar">
          <button id="importJson" type="button">Import JSON</button>
          <button id="download" type="button">Download JSON</button>
        </div>
      </header>
      <section class="stage">
        <div class="circuit" id="circuit"></div>
      </section>
      <textarea id="json" spellcheck="false"></textarea>
    </main>
  </div>

  <script>
    const gateButtons = [
      "h", "x", "y", "z",
      "s", "sdg", "t", "tdg",
      "rx", "ry", "rz", "phase",
      "cx", "cy", "cz", "ch",
      "swap", "rzz", "rxx", "ryy",
      "ccx", "cswap", "barrier", "measure",
      "reset"
    ];

    const singleTarget = new Set(["h", "x", "y", "z", "s", "sdg", "t", "tdg", "reset"]);
    const singleParam = new Set(["rx", "ry", "rz", "phase"]);
    const controlled = new Set(["cx", "cy", "cz", "ch"]);
    const twoTarget = new Set(["swap", "rzz", "rxx", "ryy"]);
    const threeTarget = new Set(["ccx", "cswap"]);

    const el = {
      qubits: document.getElementById("qubits"),
      bits: document.getElementById("bits"),
      target: document.getElementById("target"),
      control: document.getElementById("control"),
      bit: document.getElementById("bit"),
      angle: document.getElementById("angle"),
      gatePad: document.getElementById("gatePad"),
      operations: document.getElementById("operations"),
      circuit: document.getElementById("circuit"),
      json: document.getElementById("json"),
      bell: document.getElementById("bell"),
      ghz: document.getElementById("ghz"),
      undo: document.getElementById("undo"),
      clear: document.getElementById("clear"),
      importJson: document.getElementById("importJson"),
      download: document.getElementById("download")
    };

    let state = bellCircuit();

    function bellCircuit() {
      return {
        qubits: 2,
        bits: 2,
        gates: [
          { gate: "h", target: 0 },
          { gate: "cx", control: 0, target: 1 },
          { gate: "measure", qubit: 0, bit: 0 },
          { gate: "measure", qubit: 1, bit: 1 }
        ]
      };
    }

    function ghzCircuit() {
      return {
        qubits: 3,
        bits: 3,
        gates: [
          { gate: "h", target: 0 },
          { gate: "cx", control: 0, target: 1 },
          { gate: "cx", control: 1, target: 2 },
          { gate: "measure", qubit: 0, bit: 0 },
          { gate: "measure", qubit: 1, bit: 1 },
          { gate: "measure", qubit: 2, bit: 2 }
        ]
      };
    }

    function clampRegisters() {
      state.qubits = clampInt(el.qubits.value, 1, 26);
      state.bits = clampInt(el.bits.value, 0, 26);
      state.gates = state.gates.filter((gate) => gateQubits(gate).every((q) => q < state.qubits));
      state.gates = state.gates.filter((gate) => gate.bit === undefined || gate.bit < state.bits);
    }

    function clampInt(value, min, max) {
      const n = Number.parseInt(value, 10);
      if (!Number.isFinite(n)) return min;
      return Math.max(min, Math.min(max, n));
    }

    function setOptions(select, count, prefix) {
      const old = select.value;
      select.textContent = "";
      for (let i = 0; i < count; i += 1) {
        const option = document.createElement("option");
        option.value = String(i);
        option.textContent = `${prefix}${i}`;
        select.appendChild(option);
      }
      if (count > 0) select.value = Math.min(Number(old) || 0, count - 1);
    }

    function addGate(name) {
      const target = Number(el.target.value) || 0;
      const control = Number(el.control.value) || 0;
      const bit = Number(el.bit.value) || 0;
      const angle = Number(el.angle.value);
      const second = pickDifferent(target, control);
      const third = pickThird(control, target);

      let gate;
      if (singleTarget.has(name)) gate = { gate: name, target };
      if (singleParam.has(name)) gate = { gate: name, target, params: [angle] };
      if (controlled.has(name)) gate = { gate: name, control, target: pickDifferent(control, target) };
      if (twoTarget.has(name)) {
        gate = name === "swap"
          ? { gate: name, targets: [target, second] }
          : { gate: name, targets: [target, second], params: [angle] };
      }
      if (threeTarget.has(name)) gate = { gate: name, targets: [control, target, third] };
      if (name === "measure") {
        state.bits = Math.max(state.bits, bit + 1);
        gate = { gate: name, qubit: target, bit };
      }
      if (name === "barrier") gate = { gate: name, targets: allQubits() };

      if (!gate) return;
      state.gates.push(gate);
      render();
    }

    function pickDifferent(a, b) {
      if (state.qubits < 2) return a;
      return a === b ? (a + 1) % state.qubits : b;
    }

    function pickThird(a, b) {
      for (let i = 0; i < state.qubits; i += 1) {
        if (i !== a && i !== b) return i;
      }
      return b;
    }

    function allQubits() {
      return Array.from({ length: state.qubits }, (_, i) => i);
    }

    function gateQubits(gate) {
      if (Array.isArray(gate.targets)) return gate.targets;
      const qubits = [];
      if (gate.control !== undefined) qubits.push(gate.control);
      if (gate.target !== undefined) qubits.push(gate.target);
      if (gate.qubit !== undefined) qubits.push(gate.qubit);
      return qubits;
    }

    function gateLabel(gate) {
      if (gate.gate === "measure") return `m q${gate.qubit}->c${gate.bit}`;
      if (gate.control !== undefined) return `${gate.gate} q${gate.control},q${gate.target}`;
      if (Array.isArray(gate.targets)) return `${gate.gate} ${gate.targets.map((q) => `q${q}`).join(",")}`;
      if (gate.params) return `${gate.gate}(${gate.params.join(",")}) q${gate.target}`;
      return `${gate.gate} q${gate.target}`;
    }

    function renderCircuit() {
      const columns = Math.max(1, state.gates.length);
      el.circuit.style.gridTemplateColumns = `54px repeat(${columns}, 64px)`;
      el.circuit.textContent = "";

      for (let row = 0; row < state.qubits; row += 1) {
        const label = document.createElement("div");
        label.className = "wire-label";
        label.textContent = `q${row}`;
        el.circuit.appendChild(label);

        for (let col = 0; col < columns; col += 1) {
          const cell = document.createElement("div");
          cell.className = "cell";
          const gate = state.gates[col];
          if (gate) drawGateCell(cell, gate, row);
          el.circuit.appendChild(cell);
        }
      }
    }

    function drawGateCell(cell, gate, row) {
      const qubits = gateQubits(gate);
      if (qubits.length > 1 && row >= Math.min(...qubits) && row <= Math.max(...qubits)) {
        cell.classList.add("join");
      }
      if (gate.gate === "barrier" && qubits.includes(row)) return appendMark(cell, "barrier", "");
      if (gate.gate === "measure" && gate.qubit === row) return appendMark(cell, "measure", "M");
      if (gate.gate === "swap" && qubits.includes(row)) return appendMark(cell, "swap", "x");
      if (gate.control === row) return appendMark(cell, "dot", "");
      if (gate.target === row || gate.qubit === row) return appendMark(cell, "tile", gate.gate.toUpperCase());
      if (Array.isArray(gate.targets) && gate.targets.includes(row)) {
        const label = gate.targets[gate.targets.length - 1] === row ? gate.gate.toUpperCase() : "C";
        return appendMark(cell, "tile", label);
      }
    }

    function appendMark(cell, className, text) {
      const mark = document.createElement("div");
      mark.className = className;
      mark.textContent = text;
      cell.appendChild(mark);
    }

    function renderOperations() {
      el.operations.textContent = "";
      state.gates.forEach((gate, index) => {
        const item = document.createElement("li");
        const label = document.createElement("span");
        const remove = document.createElement("button");
        label.textContent = gateLabel(gate);
        remove.type = "button";
        remove.textContent = "x";
        remove.setAttribute("aria-label", `Remove gate ${index + 1}`);
        remove.addEventListener("click", () => {
          state.gates.splice(index, 1);
          render();
        });
        item.append(label, remove);
        el.operations.appendChild(item);
      });
    }

    function render() {
      el.qubits.value = state.qubits;
      el.bits.value = state.bits;
      setOptions(el.target, state.qubits, "q");
      setOptions(el.control, state.qubits, "q");
      setOptions(el.bit, Math.max(1, state.bits), "c");
      renderCircuit();
      renderOperations();
      el.json.value = JSON.stringify(state, null, 2);
    }

    gateButtons.forEach((name) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = name.toUpperCase();
      button.addEventListener("click", () => addGate(name));
      el.gatePad.appendChild(button);
    });

    el.qubits.addEventListener("change", () => {
      clampRegisters();
      render();
    });
    el.bits.addEventListener("change", () => {
      clampRegisters();
      render();
    });
    el.bell.addEventListener("click", () => {
      state = bellCircuit();
      render();
    });
    el.ghz.addEventListener("click", () => {
      state = ghzCircuit();
      render();
    });
    el.undo.addEventListener("click", () => {
      state.gates.pop();
      render();
    });
    el.clear.addEventListener("click", () => {
      state.gates = [];
      render();
    });
    el.importJson.addEventListener("click", () => {
      try {
        const parsed = JSON.parse(el.json.value);
        state = {
          qubits: clampInt(parsed.qubits, 1, 26),
          bits: clampInt(parsed.bits ?? 0, 0, 26),
          gates: Array.isArray(parsed.gates) ? parsed.gates : []
        };
        clampRegisters();
        render();
      } catch (error) {
        alert(`Invalid JSON: ${error.message}`);
      }
    });
    el.download.addEventListener("click", () => {
      const blob = new Blob([el.json.value + "\n"], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "circuit.prismq.json";
      link.click();
      URL.revokeObjectURL(link.href);
    });

    render();
  </script>
</body>
</html>

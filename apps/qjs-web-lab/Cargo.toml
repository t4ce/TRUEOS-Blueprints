[package]
name = "qjs-web-lab"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
links = "quickjs"
build = "build.rs"

[lib]
name = "trueos_qjs"
path = "src/lib.rs"

[[bin]]
name = "qjs-web-lab"
path = "src/headless.rs"

[dependencies]
serde_json = "1"

[build-dependencies]
cc = "1.0"

[features]
default = ["native-engine"]
native-engine = []
lightningcss-native = []
kernel-code-model = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))', 'cfg(feature, values("trueos"))'] }

[workspace]
resolver = "3"

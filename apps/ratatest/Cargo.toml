[package]
name = "ratatest"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
ratatui = { workspace = true, features = ["crossterm_0_29", "all-widgets", "layout-cache", "underline-color", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
time = { workspace = true, features = ["std"] }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
trueos = { workspace = true }

trueos-terminal = { path = "../../../TRUEOS/crates/trueos-terminal" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

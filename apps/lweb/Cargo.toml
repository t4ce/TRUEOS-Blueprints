[package]
name = "lweb"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
frog = { package = "Frog", path = "../Frog" }

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
trueos = { path = "../../api", features = ["tokio-net-probe"] }
tokio = { version = "=1.54.1", default-features = false, features = ["native-net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[workspace]

[patch.crates-io]
tokio = { path = "../../../TRUEOS-Buildins/vendor/tokio-1.54.1" }
mio = { path = "../../../TRUEOS/vendor/mio-1.2.0" }
reqwest = { path = "../../../TRUEOS-Buildins/vendor/reqwest-0.13.3" }
hyper = { path = "../../../TRUEOS/vendor/hyper-1.10.0" }

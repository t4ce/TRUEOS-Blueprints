[package]
name = "pi_snake"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Immediate Shell2 Pi Snake with a two-player browser endpoint"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "pi_snake"
path = "src/main.rs"
test = false
bench = false

[dependencies]
trueos = { path = "../../api", features = ["tokio-net-probe"] }

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["native-net"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[patch.crates-io]
mio = { path = "../../../TRUEOS/vendor/mio-1.2.0" }
rustix = { path = "../../../TRUEOS-Buildins/vendor/rustix-1.1.4-trueos" }
tokio = { path = "../../../TRUEOS-Buildins/vendor/tokio-1.54.1" }

[profile.dev]
codegen-units = 1
debug = "full"
lto = true
opt-level = 3
panic = "abort"
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

[package]
name = "img"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[package.metadata.trueos-blueprint]
replicatable = true

[[bin]]
name = "img"
path = "src/main.rs"
test = false
bench = false

[dependencies]
core3 = { version = "0.1.2", default-features = false, features = ["alloc"] }
png = { version = "0.18.1", default-features = false }
trueos = { workspace = true, features = ["ui4-scene"] }

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRUEOS Strudel Core</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="identity">
        <div class="mark" aria-hidden="true">🎛</div>
        <div>
          <h1>Strudel Core</h1>
          <p>QuickJS patterns · TRUEOS host audio</p>
        </div>
      </div>
      <div class="actions">
        <span id="revision" class="revision">revision —</span>
        <button id="submit" type="button">
          Submit
          <kbd>Ctrl</kbd><span>+</span><kbd>Enter</kbd>
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="editor-pane pattern-pane" aria-labelledby="pattern-title">
        <div class="pane-head">
          <strong id="pattern-title">Pattern</strong>
          <span>editable · host QuickJS</span>
        </div>
        <div id="pattern-editor" class="editor-host" aria-label="JavaScript pattern editor"></div>
      </section>
      <section class="editor-pane instrument-pane" aria-labelledby="instrument-title">
        <div class="pane-head">
          <strong id="instrument-title">Instruments</strong>
          <span>read-only · notation palette</span>
        </div>
        <div id="instrument-editor" class="editor-host" aria-label="Read-only TRUEOS instrument notation"></div>
      </section>
    </main>

    <section class="result" aria-live="polite">
      <div class="result-head">
        <span id="status-dot" class="status-dot idle"></span>
        <strong id="status">starting</strong>
      </div>
      <pre id="detail">Connecting to the host pattern engine…</pre>
    </section>

    <footer class="statusbar">
      <span id="runtime">runtime —</span>
      <span id="position">Ln 1, Col 1</span>
    </footer>
  </div>

  <script src="/instrument-catalog.js"></script>
  <script src="/monaco/vs/loader.js"></script>
  <script src="/app.js"></script>
</body>
</html>

[package]
name = "strudel_core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "strudel_core"
path = "src/lib.rs"

[[bin]]
name = "strudel_core"
path = "src/main.rs"

[dependencies]
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
trueos-qjs = { path = "../qjs/crates/trueos-qjs", features = ["trueos"] }
trueos = { workspace = true, features = ["lifecycle-net"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[package]
name = "velosrv"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Experimental TRUEOS Blueprint build of the Veloren server CLI"

[package.metadata.trueos-blueprint]
replicatable = false

[package.metadata.trueos-blueprint.build-env-paths]
CARGO_WORKSPACE_DIR = "../../../veloren"


[workspace]
resolver = "3"

[features]
default = []
worldgen = ["server/worldgen", "dep:world"]
persistent_world = ["server/persistent_world"]
tracy = ["common-frontend/tracy"]
plugins = ["server/plugins"]
hot-reloading = ["server/hot-reloading"]
hot-agent = ["server/hot-agent", "dep:agent"]
hot-site = ["server/hot-site", "dep:world"]

[[bin]]
name = "velosrv"
path = "src/main.rs"

[dependencies]
server = { package = "veloren-server", path = "../../../veloren/server", default-features = false, features = ["simd"] }
agent = { package = "veloren-server-agent", path = "../../../veloren/server/agent", optional = true }
common = { package = "veloren-common", path = "../../../veloren/common" }
common-base = { package = "veloren-common-base", path = "../../../veloren/common/base" }
common-net = { package = "veloren-common-net", path = "../../../veloren/common/net" }
common-frontend = { package = "veloren-common-frontend", path = "../../../veloren/common/frontend" }
world = { package = "veloren-world", path = "../../../veloren/world", optional = true }

tokio = { version = "=1.52.3", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "fs", "net"] }
num_cpus = "1.0"
clap = { version = "4.2", features = ["derive", "env"] }
lazy_static = "1.4.0"
signal-hook = "0.4.3"
shell-words = "1.0.0"
tracing = "0.1"
ron = { version = "0.12", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["rc", "derive"] }
rand = { version = "0.10", features = ["alloc"] }
specs = { version = "0.20", features = ["nightly"] }
quinn = "=0.11.9"
trueos = { path = "../../api", features = ["lifecycle-net"] }

axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
hyper = { version = "=1.10.0", default-features = false, features = ["client", "server", "http1"] }
http-body-util = { version = "0.1.3", default-features = false }
prometheus = { version = "0.14", default-features = false }
chrono = { version = "0.4.24", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }

[target.'cfg(windows)'.dependencies]
mimalloc = "0.1"

[patch.crates-io]
specs = { git = "https://github.com/amethyst/specs.git", rev = "4e2da1df29ee840baa9b936593c45592b7c9ae27" }
thread-priority = { path = "stubs/thread-priority" }
tracing-appender = { path = "vendor/tracing-appender" }

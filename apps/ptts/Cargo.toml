[package]
name = "ptts"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "English Azelma runtime synthesis proof for TRUEOS"

[workspace]
resolver = "3"

[package.metadata.trueos-blueprint]
entry-abi = "argv-v1"
filesystem-independent = true
replicatable = false
rewrite-std-imports = false
vm-core-preference = "performance"

[dependencies]
anyhow = "1"
serde_json = "=1.0.150"
serde = { version = "=1.0.228", features = ["derive"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
ptts-core = { package = "ptts", git = "https://github.com/gabrieldemarmiesse/xn-ptts", rev = "7efa26973f81bba42cf2ace8da2c1eb9b605d54d", default-features = false }
xn = "=0.2.12"
# Match the SDK's maintained native boundary; inference uses byte buffers, not mmap.
memmap2 = "=0.9.11"
rand = { version = "=0.9.5", default-features = false, features = ["std_rng"] }
rand_distr = "=0.5.1"
safetensors = "=0.7.0"
half = "=2.7.1"
trueos-kokoro-audio = { path = "../ttstt/crates/trueos-kokoro/audio" }
trueos-kokoro-g2p = { path = "../ttstt/crates/trueos-kokoro/g2p" }

[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../../api" }

[build-dependencies]
sha2 = "=0.10.9"
serde_json = "=1.0.150"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[profile.release]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos"))'] }

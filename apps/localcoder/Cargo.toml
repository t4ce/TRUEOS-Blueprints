[package]
name = "localcoder"
version = "0.1.9"
edition = "2024"
description = "oxink."
license = "MIT"
readme = "README.md"
repository = "https://github.com/iamwjun/localcoder"

[dependencies]
# HTTP client
reqwest.workspace = true
# Async runtime
tokio.workspace = true
trueos.workspace = true
# JSON handling
serde.workspace = true
serde_json.workspace = true
# Error handling
anyhow.workspace = true
# CLI interaction
rustyline.workspace = true
# Terminal colors
colored.workspace = true
# File globbing (S03 GlobTool)
glob.workspace = true
# File walking with .gitignore support (S03 GrepTool)
ignore.workspace = true
# Regex engine (S03 GrepTool)
regex.workspace = true
serde_yaml.workspace = true

[dev-dependencies]
tempfile.workspace = true

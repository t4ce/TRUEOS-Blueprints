[build]
target = "trueos.json"

[unstable]
build-std = ["core", "compiler_builtins", "alloc", "std", "panic_abort"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

[target.'cfg(target_os = "trueos")']
rustflags = [
  "--cfg", "getrandom_backend=\"custom\"",
  "-C", "force-frame-pointers=yes",
]

[package]
name = "xpapp"
version = "0.1.0"
edition = "2024"

[package.metadata.trueos-blueprint]
replicatable = false
profile = "release"

[[bin]]
name = "xpapp"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["bypass-critical-sections", "trace-execution"]
# Explicit WC3 performance experiment: guest enter/leave return without locking.
bypass-critical-sections = []
diagnostics = []
actor-execution = []
carrier-selftest = []
preview-first-draw = []
nolog = []
perf = []
host-memmove = []
host-strncmp = []
host-strnicmp = []
host-stricmp = []
host-isdigit = []
host-ismbcspace = []
host-decimal = []
host-toupper = []
host-qsort = []
guest-initterm = []
guest-event-pool = []
guest-record-expand = []
replay-arrays = []
trace-scan = []
trace-seh = []
trace-api = []
trace-init = []
# Aggregate execution timing is enabled for the current performance diagnosis.
trace-execution = []
# Retained experiment; production uses the scalar renderer.
raster-pool = []
# CPU geometry with frame-batched GPU rasterization; explicit experiment.
gpu-raster = ["staticgl-triangle/prepared-raster"]
trace-all = ["trace-scan", "trace-seh", "trace-api", "trace-init"]

[dependencies]
staticgl-triangle = { path = "staticgl-triangle" }
sha2 = "=0.10.9"
tokio = { workspace = true, features = ["rt", "sync", "time"] }
trueos = { path = "../../api", features = ["tokio-runtime", "ui4-scene", "wc3-x86"] }

[dev-dependencies]
pretty_assertions.workspace = true

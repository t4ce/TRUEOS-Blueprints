[package]
name = "download-smoke"
version = "0.1.0"
edition = "2024"

[package.metadata.trueos-blueprint]
replicatable = false

[dependencies]
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
trueos = { path = "../../api", features = ["ui4-scene"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[workspace]

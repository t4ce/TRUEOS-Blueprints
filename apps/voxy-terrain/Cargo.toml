[package]
name = "voxy-terrain"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace]

[package.metadata.trueos-blueprint]
profile = "bringup"
replicatable = false

[package.metadata.trueos-blueprint.build-env-paths]
CARGO_WORKSPACE_DIR = "../../../voxy"

[dependencies]
veloren-voxygen = { package = "voxy", path = "../../../voxy", features = ["terrain-bringup"] }
trueos = { path = "../../api", features = ["ui4-scene", "tokio-net-probe"] }

# Same bring-up profile and dependency pins as the preserved Voxy client.
[profile.bringup]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
debug = 0
strip = "symbols"

[patch.crates-io]
# Shared vendored sources: Blueprint patches take precedence over kernel duplicates.
alsa = { path = "../../../TRUEOS/vendor/alsa-0.11.0" }
base64 = { path = "../../vendor/base64-0.22.1" }
bincode = { path = "../../../TRUEOS/vendor/bincode-1.3.3" }
bytes = { path = "../../vendor/bytes-1.11.1" }
crc32fast = { path = "../../../TRUEOS/vendor/crc32fast-1.5.0" }
crossbeam-deque = { path = "../../vendor/crossbeam-deque-0.8.6" }
crossbeam-epoch = { path = "../../../voxy/vendor/crossbeam-epoch-0.9.18" }
crossbeam-queue = { path = "../../../voxy/vendor/crossbeam-queue-0.3.12" }
crossbeam-utils = { path = "../../vendor/crossbeam-utils-0.8.21" }
fdeflate = { path = "../../../TRUEOS/vendor/fdeflate-0.3.7" }
futures-util = { path = "../../../TRUEOS/vendor/futures-util-0.3.32" }
getrandom = { path = "../../vendor/getrandom-0.2.17" }
getrandom_03 = { package = "getrandom", path = "../../vendor/getrandom-0.3.4" }

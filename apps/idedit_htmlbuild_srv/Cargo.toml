[package]
name = "idedit_htmlbuild_srv"
version = "0.1.0"
edition = "2024"

[package.metadata.trueos-blueprint]
fs-scope = "trueosfs"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "macros", "fs", "io-util", "time", "sync"] }
hyper = { version = "=1.10.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
serde_json = "1"
percent-encoding = "2"
trueos-ide = { path = "../../crates/trueos-ide", features = ["store"] }

[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../../api", features = ["tokio-runtime", "tokio-net-probe"] }
# Keep std-facing I/O types while selecting native socket IDs and readiness.
tokio = { version = "=1.54.1", default-features = false, features = ["native-net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos"))'] }

[workspace]

[patch.crates-io]
# Cargo resolves target-specific features on the host too.
tokio = { path = "../../../TRUEOS-Buildins/vendor/tokio-1.54.1" }
mio = { path = "../../../TRUEOS/vendor/mio-1.2.0" }

[package]
name = "Frog"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "Frog"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "rustls"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["alloc"] }
tokio = { version = "=1.52.3", default-features = false, features = ["full"] }
trueos-weather = { path = "trueos-weather" }

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
trueos = { path = "../../api", features = ["tokio-net-probe", "ui4-scene"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[workspace]
exclude = ["trueos-weather"]

[patch.crates-io]
reqwest = { path = "../../vendor/reqwest-0.13.3" }

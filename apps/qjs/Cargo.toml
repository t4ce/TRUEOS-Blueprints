[package]
name = "qjs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "qjs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = { path = "../../vendor/crossterm-0.29.0-trueos", default-features = false, features = ["bracketed-paste", "events"] }
trueos-qjs = { path = "crates/trueos-qjs", features = ["trueos"] }

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
trueos = { path = "../../api" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[workspace]
resolver = "3"

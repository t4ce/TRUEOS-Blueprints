[package]
name = "qjs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
links = "quickjs"
build = "build.rs"

[lib]
name = "trueos_qjs"
path = "src/lib.rs"

[[bin]]
name = "qjs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = { path = "../../../TRUEOS-Buildins/vendor/crossterm-0.29.0-trueos", default-features = false, features = ["bracketed-paste", "events"] }
spin = "0.10.1"
embassy-time-driver = { version = "0.2.2", default-features = false, optional = true }
trueos-time = { path = "../../../TRUEOS/crates/trueos-executor/embassy-time", default-features = false, optional = true, features = ["tick-hz-1_000"] }
libm = { version = "0.2", default-features = false, optional = true }
v = { path = "../../crates/trueos-v", default-features = false }
trueos-locale = { path = "../../../TRUEOS/crates/trueos-locale", default-features = false, optional = true }
lightningcss = { version = "1.0.0-alpha.70", default-features = false, optional = true }

[build-dependencies]
cc = "1.0"

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
trueos = { path = "../../api" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[features]
default = ["trueos"]
native-engine = []
lightningcss-native = ["dep:lightningcss"]
kernel-code-model = []
trueos = ["dep:trueos-locale", "dep:embassy-time-driver", "dep:trueos-time", "dep:libm"]

[workspace]
resolver = "3"

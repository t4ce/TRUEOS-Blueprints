[package]
name = "calculator"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "calculator"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = { path = "../../../TRUEOS-Buildins/vendor/crossterm-0.29.0-trueos", default-features = false, features = ["events"] }
trueos-math = { path = "../../crates/trueos-math" }

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
# Crossterm uses Mio directly, without Tokio networking to forward this opt-in.
mio = { version = "=1.2.0", default-features = false, features = ["std-compat", "native-net"] }
trueos = { path = "../../api" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[workspace]

[patch.crates-io]
# Cargo resolves target-specific features on the host too.
mio = { path = "../../../TRUEOS/vendor/mio-1.2.0" }

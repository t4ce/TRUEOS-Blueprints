[package]
name = "shadertoy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata.trueos-blueprint]
replicatable = false

[[bin]]
name = "shadertoy"
path = "src/main.rs"

[dependencies]
http-body-util = { version = "=0.1.3", default-features = false }
hyper = { version = "=1.9.0", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["http1", "tls12", "webpki-roots"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy", "http1", "tokio"] }
rustls-rustcrypto = { version = "=0.0.2-alpha", default-features = false, features = ["std", "tls12"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
tokio = { version = "=1.52.3", default-features = false, features = ["fs", "macros", "net", "rt", "time"] }

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
trueos = { path = "../../api", features = ["tokio-net-probe"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[workspace]

[package]
name = "emomodel"
version = "0.1.0"
edition = "2024"

[workspace]

[package.metadata.trueos-blueprint]
entry-abi = "argv-v1"
fs-scope = "trueosfs"
replicatable = false
rewrite-std-imports = false

[dependencies]
anyhow = "1"
gltf = { version = "1.4.1", default-features = false, features = ["names", "utils"] }
lico-graph = { path = "../../crates/lico-graph" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos"))'] }

[target.'cfg(target_os = "trueos")'.dependencies]
bfly = { path = "../bfly" }
crossterm = { version = "0.29", default-features = false, features = ["event-stream"] }
futures-core = "0.3"
glam = "0.33.6"
png = "0.18.1"
trueos = { path = "../../api", features = ["ui4-scene"] }

[dev-dependencies]
glam = "0.33.6"

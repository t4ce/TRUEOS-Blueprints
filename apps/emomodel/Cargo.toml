[package]
name = "emomodel"
version = "0.1.0"
edition = "2024"

[workspace]

[package.metadata.trueos-blueprint]
entry-abi = "argv-v1"
fs-scope = "trueosfs"
replicatable = false
rewrite-std-imports = false

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos"))'] }

[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../../api" }

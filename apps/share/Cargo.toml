[package]
name = "share"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
dav-server = { version = "=0.11.0", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hyper = { version = "=1.10.0", default-features = false, features = ["server", "http1"] }
tokio = { version = "=1.54.1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt", "sync"] }

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
httpdate = { version = "=1.0.3", features = ["std-system-time"] }
trueos = { path = "../../api", features = ["tokio-net-probe"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

# Test the same server sources with upstream desktop dependencies. The parent
# workspace's Hyper/http-body-util patches currently only build on TRUEOS.
[package]
name = "share-host"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
name = "share"
path = "../src/lib.rs"

[[bin]]
name = "share"
path = "../src/main.rs"

[[test]]
name = "webdav"
path = "../tests/webdav.rs"

[dependencies]
bytes = "1"
dav-server = { version = "=0.11.0", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hyper = { version = "=1.10.0", default-features = false, features = ["server", "http1"] }
tokio = { version = "=1.54.1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt", "sync"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

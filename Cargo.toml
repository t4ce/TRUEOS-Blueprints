[package]
name = "trueos-blueprint"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "api",
    "apps/chart",
    "apps/cli_tetris",
    "apps/crates/trueos-currency",
    "apps/crates/trueos-flags",
    "apps/crates/trueos-tetris",
    "apps/crates/trueos-weather",
    "apps/currency",
    "apps/currency_reqwest",
    "apps/flags",
    "apps/framework_stack",
    "apps/full_tetris",
    "apps/hello_world",
    "apps/localcoder",
    "apps/mandelbrot",
    "apps/particle",
    "apps/petersen",
    "apps/retrosun",
    "apps/svg_grid",
    "apps/test_some_crates",
    "apps/tokio_fs",
    "apps/tokio_net",
    "apps/tokio_rt",
    "apps/triangle",
    "apps/weather",
]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
anyhow = { version = "1.0", default-features = false }
colored = "2.1"
glob = "0.3"
http-body-util = { path = "../../vendor/http-body-util-0.1.3", default-features = false }
hyper = { version = "1.9", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { path = "../../vendor/hyper-util-0.1.20", default-features = false }
ignore = "0.4"
libm = { version = "0.2", default-features = false }
regex = { version = "1", default-features = false, features = ["perf"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json"] }
rustls = { version = "0.23.27", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { path = "../../vendor/rustls-rustcrypto-0.0.2-alpha", default-features = false, features = ["std", "tls12"] }
rustyline = "14.0"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1.52.1", default-features = false, features = ["full"] }
tokio-rustls = { path = "../../vendor/tokio-rustls-0.26.4", default-features = false, features = ["tls12"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
trueos = { path = "api" }
trueos-currency = { path = "apps/crates/trueos-currency" }
trueos-flags = { path = "apps/crates/trueos-flags" }
trueos-gfx-core = { path = "../trueos-gfx-core" }
trueos-tetris = { path = "apps/crates/trueos-tetris" }
trueos-weather = { path = "apps/crates/trueos-weather" }
webpki-roots = { version = "1", default-features = false }

[features]
default = []
tokio-runtime = ["trueos/tokio-runtime"]
tokio-net-probe = ["tokio-runtime", "trueos/tokio-net-probe"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trueos.workspace = true

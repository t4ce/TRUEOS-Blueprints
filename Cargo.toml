[package]
name = "trueos-blueprint"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "api",
    "apps/chatserver",
    "apps/condvar",
    "apps/cross",
    "apps/file-system",
    "apps/fileexplorer",
    "apps/framework_stack",
    "apps/gridpaper",
    "apps/hello_world",
    "apps/hello_world_replicatable",
    "apps/ipp-printer",
    "apps/esp32_stt",
    "apps/flight_controller_sim",
    "apps/monaco",
    "apps/prismq",
    "apps/posix_fd_probe",
    "apps/panick",
    "apps/particle",
    "apps/unix_api_probe",
    "apps/rusqlite_probe",
    "apps/prism_q_probe",
    "apps/skybox",
    "apps/system-services",
    "apps/test_some_crates",
    "apps/texteditor",
    "apps/tokio_fs",
    "apps/tokio_net",
    "apps/tokio_rt",
    "apps/webdevices",
    "apps/webmail",
    "apps/wls",
]
exclude = [
    "crates",
    "crates/*",
    "apps/Frog",
    "apps/Player",
    "apps/rebels-in-the-sky",
    "apps/aud-player-scope-tui",
    "vendor",
    "vendor/*",
    "vendor/ratatui/**",
    "vendor/ratatui/ratatui",
    "vendor/ratatui/ratatui-core",
    "vendor/ratatui/ratatui-crossterm",
    "vendor/ratatui/ratatui-macros",
    "vendor/ratatui/ratatui-termina",
    "vendor/ratatui/ratatui-termion",
    "vendor/ratatui/ratatui-termwiz",
    "vendor/ratatui/ratatui-widgets",
]
default-members = ["."]
resolver = "3"

[workspace.package]
documentation = "https://docs.rs/ratatui/latest/ratatui/"
repository = "https://github.com/t4ce/ratatui"
homepage = "https://ratatui.rs"
keywords = ["dashboard", "terminal", "tui"]
categories = ["command-line-interface"]
readme = "vendor/ratatui/README.md"
license = "MIT"
exclude = ["*.log", ".github", "CONTRIBUTING.md", "Makefile.toml", "assets/*", "tags"]
edition = "2024"
rust-version = "1.88.0"

[workspace.dependencies]
anyhow = { version = "1.0", default-features = false }
anstyle = "1.0.3"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bitflags = "2.9"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
color-eyre = "0.6"
compact_str = { version = "0.9", default-features = false }
criterion = { version = "0.8", features = ["html_reports"] }
critical-section = "1.2"
crossterm = "0.29"
document-features = "0.2.11"
fakeit = "1"
futures = "0.3"
glob = "0.3"
hashbrown = "0.17"
http-body-util = { version = "0.1.3", default-features = false }
hyper = { version = "1.9.0", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.20", default-features = false }
ignore = "0.4"
indoc = "2.0.5"
instability = "0.3.7"
ipp = { version = "=6.0.1", default-features = false }
itertools = { version = "0.15", default-features = false, features = ["use_alloc"] }
kasuari = { version = "0.4.9", default-features = false }
line-clipping = "0.3"
libm = { version = "0.2", default-features = false }
lru = "0.18"
octocrab = "0.53"
palette = { version = "0.7.6", default-features = false, features = ["libm"] }
pretty_assertions = "1"
prism-q = { version = "=0.20.0", default-features = true }
rand = "0.10"
rand_chacha = "0.10"
rayon = { version = "=1.12.0" }
ratatui = { path = "vendor/ratatui/ratatui", version = "0.30.2", default-features = false }
ratatui-core = { path = "vendor/ratatui/ratatui-core", version = "0.1.2" }
ratatui-crossterm = { path = "vendor/ratatui/ratatui-crossterm", version = "0.1.2" }
ratatui-macros = { path = "vendor/ratatui/ratatui-macros", version = "0.7.2" }
ratatui-termina = { path = "vendor/ratatui/ratatui-termina", version = "0.1.0" }
ratatui-termion = { path = "vendor/ratatui/ratatui-termion", version = "0.1.2" }
ratatui-termwiz = { path = "vendor/ratatui/ratatui-termwiz", version = "0.1.2" }
ratatui-widgets = { path = "vendor/ratatui/ratatui-widgets", version = "0.3.2", default-features = false }
regex = { version = "1", default-features = false, features = ["perf"] }
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "rustls", "http2"] }
rstest = "0.26"
rustls = { version = "0.23.27", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["std", "tls12"] }
rustyline = "14.0"
serde = { version = "=1.0.228", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["alloc"] }
serde_yaml = "0.9"
strum = { version = "0.28", default-features = false, features = ["derive"] }
tempfile = "3"
termina = "0.3"
termion = "4"
termwiz = "0.23"
thiserror = { version = "2.0.12", default-features = false }
time = { version = "0.3.37", default-features = false }
tokio = { version = "=1.52.3", default-features = false, features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12"] }
tokio-stream = "0.1"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.37"
tracing-appender = "0.2"
tracing-subscriber = "0.3.10"
trueos = { path = "api" }
trueos-chat = { path = "apps/chatserver/trueos-chat" }
trybuild = "1.0.19"
tui-input = { path = "vendor/tui-input-0.15.3", version = "0.15.3", default-features = false }
unicode-segmentation = "1.9"
unicode-truncate = { version = "2", default-features = false }
unicode-width = ">=0.2.0"
webpki-roots = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
pedantic = { level = "warn", priority = -1 }
module_inception = "allow"
as_underscore = "warn"
deref_by_slicing = "warn"
else_if_without_else = "warn"
empty_line_after_doc_comments = "warn"
equatable_if_let = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
implicit_clone = "warn"
map_err_ignore = "warn"
missing_const_for_fn = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
needless_pass_by_ref_mut = "warn"
needless_raw_strings = "warn"
or_fun_call = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
unnecessary_self_imports = "warn"
use_self = "warn"

[features]
default = []
tokio-runtime = []
tokio-net-probe = []

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[patch.crates-io]
axum = { path = "vendor/axum-0.8.9" }
axum-core = { path = "vendor/axum-core-0.5.6" }
base64 = { path = "vendor/base64-0.22.1" }
bytes = { path = "vendor/bytes-1.11.1" }
crossbeam = { path = "vendor/crossbeam-0.8.4" }
crossbeam-channel = { path = "vendor/crossbeam-channel-0.5.15" }
crossbeam-deque = { path = "vendor/crossbeam-deque-0.8.6" }
crossbeam-epoch = { path = "vendor/crossbeam-epoch-0.9.18" }
crossbeam-queue = { path = "vendor/crossbeam-queue-0.3.12" }
crossbeam-skiplist = { path = "vendor/crossbeam-skiplist-0.1.3" }
crossbeam-utils = { path = "vendor/crossbeam-utils-0.8.21" }
form_urlencoded = { path = "vendor/form_urlencoded-1.2.2" }
getrandom = { path = "vendor/getrandom-0.2.17" }
getrandom_03 = { package = "getrandom", path = "vendor/getrandom-0.3.4" }
getrandom_04 = { package = "getrandom", path = "vendor/getrandom-0.4.2" }
h2 = { path = "vendor/h2-0.4.14" }
hickory-proto = { path = "vendor/hickory-proto-0.25.2" }
hickory-resolver = { path = "vendor/hickory-resolver-0.25.2" }
if-watch = { path = "vendor/if-watch-3.2.2" }
http = { path = "vendor/http-1.4.0" }
http-body = { path = "vendor/http-body-1.0.1" }
http-body-util = { path = "vendor/http-body-util-0.1.3" }
httpdate = { path = "vendor/httpdate-1.0.3" }
hyper = { path = "vendor/hyper-1.9.0" }
hyper-rustls = { path = "vendor/hyper-rustls-0.27.9" }
hyper-util = { path = "vendor/hyper-util-0.1.20" }
libp2p-mdns = { path = "vendor/libp2p-mdns-0.48.0" }
matchit = { path = "vendor/matchit-0.8.4" }
mime = { path = "vendor/mime-0.3.17" }
mio = { path = "vendor/mio-1.2.0" }
percent-encoding = { path = "vendor/percent-encoding-2.3.2" }
prism-q = { path = "vendor/prism-q-0.20.0" }
quinn = { path = "vendor/quinn-0.11.9" }
quinn-proto = { path = "vendor/quinn-proto-0.11.14" }
quinn-udp = { path = "vendor/quinn-udp-0.5.14" }
reqwest = { path = "vendor/reqwest-0.13.3" }
ring = { path = "vendor/ring-0.17.14" }
rayon = { path = "vendor/rayon" }
rayon-core = { path = "vendor/rayon/rayon-core" }
rustls-rustcrypto = { path = "vendor/rustls-rustcrypto-0.0.2-alpha" }
serde_urlencoded = { path = "vendor/serde_urlencoded-0.7.1" }
socket2 = { path = "vendor/socket2-0.6.3" }
spin = { path = "vendor/spin-0.10.0" }
sync_wrapper = { path = "vendor/sync_wrapper-1.0.2" }
tokio = { path = "vendor/tokio-1.52.3" }
tokio-macros = { path = "vendor/tokio-macros-2.7.0" }
tokio-rustls = { path = "vendor/tokio-rustls-0.26.4" }
tokio-tungstenite = { path = "vendor/tokio-tungstenite-0.29.0" }
tokio-util = { path = "vendor/tokio-util-0.7.18" }
tower = { path = "vendor/tower-0.5.3" }
tower-http = { path = "vendor/tower-http-0.6.9" }
tower-layer = { path = "vendor/tower-layer-0.3.3" }
tower-service = { path = "vendor/tower-service-0.3.3" }
want = { path = "vendor/want-0.3.1" }

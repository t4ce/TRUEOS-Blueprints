[package]
name = "trueos-blueprint"
version = "0.1.0"
edition = "2024"

[features]
default = ["tokio-runtime"]
tokio-runtime = ["dep:tokio"]
tokio-net-probe = ["tokio-runtime", "tokio/net", "dep:mio", "dep:socket2"]
clone-probe = []
thin-default-global-allocator = ["trueos/default-global-allocator"]
thin-default-panic-handler = ["trueos/default-panic-handler"]

[lib]
name = "trueos_blueprint"
path = "src/lib.rs"

[[bin]]
name = "trueos-blueprint"
path = "src/main.rs"

[[example]]
name = "hello_world"
path = "hello_world/hello_world.rs"

[[example]]
name = "triangle"
path = "triangle/main.rs"

[[example]]
name = "ntp_once"
path = "ntp_once/ntp_once.rs"

[[example]]
name = "apidemo"
path = "apidemo/main.rs"

[[example]]
name = "tokio_net"
path = "tokio_net/main.rs"

[[example]]
name = "clone_probe"
path = "clone_probe/main.rs"
required-features = ["clone-probe"]

[dependencies]
trueos = { path = "trueos" }
tokio = { path = "TRUEOS/vendor/tokio-1.52.1", optional = true, default-features = false, features = ["rt", "sync", "time", "io-util", "io-std", "fs", "macros"] }
mio = { path = "TRUEOS/vendor/mio-1.2.0", optional = true, default-features = false, features = ["os-poll", "net"] }
socket2 = { path = "TRUEOS/vendor/socket2-0.6.3", optional = true, default-features = false }

[patch.crates-io]
gix-config-value = { path = "vendor/gix-config-value-0.17.2" }
gix-sec = { path = "vendor/gix-sec-0.13.3" }
mio = { path = "TRUEOS/vendor/mio-1.2.0" }
socket2 = { path = "TRUEOS/vendor/socket2-0.6.3" }
trueos-sys = { path = "TRUEOS/crates/trueos-sys" }

[package]
name = "trueos-blueprint"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "api",
    "apps/chatserver",
    "apps/file-system",
    "apps/fileexplorer",
    "apps/framework_stack",
    "apps/hello_world",
    "apps/localcoder",
    "apps/test_some_crates",
    "apps/tokio_fs",
    "apps/tokio_net",
    "apps/tokio_rt",
    "apps/webdevices",
    "apps/webmail",
]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
anyhow = { version = "1.0", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
colored = "2.1"
glob = "0.3"
http-body-util = { path = "../TRUEOS/vendor/http-body-util-0.1.3", default-features = false }
hyper = { version = "1.9", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { path = "../TRUEOS/vendor/hyper-util-0.1.20", default-features = false }
ignore = "0.4"
libm = { version = "0.2", default-features = false }
regex = { version = "1", default-features = false, features = ["perf"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json"] }
rustls = { version = "0.23.27", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { path = "../TRUEOS/vendor/rustls-rustcrypto-0.0.2-alpha", default-features = false, features = ["std", "tls12"] }
rustyline = "14.0"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1.52.3", default-features = false, features = ["full"] }
tokio-rustls = { path = "../TRUEOS/vendor/tokio-rustls-0.26.4", default-features = false, features = ["tls12"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
trueos = { path = "api" }
trueos-chat = { path = "apps/chatserver/trueos-chat" }
trueos-currency = { path = "apps/currency_reqwest/trueos-currency" }
trueos-flags = { path = "apps/flags/trueos-flags" }
trueos-tetris = { path = "apps/crates/trueos-tetris" }
trueos-weather = { path = "apps/weather/trueos-weather" }
webpki-roots = { version = "1", default-features = false }

[features]
default = []
tokio-runtime = ["trueos/tokio-runtime"]
tokio-net-probe = ["tokio-runtime", "trueos/tokio-net-probe"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trueos.workspace = true

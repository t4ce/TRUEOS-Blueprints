[package]
name = "trueos-blueprint"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "api", "apps/hello_world", "apps/petersen", "apps/svg_grid"]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
trueos = { path = "api" }

[features]
default = []
tokio-runtime = ["trueos/tokio-runtime"]
tokio-net-probe = ["tokio-runtime", "trueos/tokio-net-probe"]
thin-default-global-allocator = ["trueos/default-global-allocator"]
thin-default-panic-handler = ["trueos/default-panic-handler"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trueos.workspace = true
